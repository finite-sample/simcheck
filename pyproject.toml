[project]
name = "simcheck"
description = "Monte Carlo tests for statistical estimators: unbiasedness, coverage, size and power, with gates derived from the replicate count"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/finite-sample/simcheck"
Documentation = "https://finite-sample.github.io/simcheck/"
Repository = "https://github.com/finite-sample/simcheck"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["src/simcheck"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]
# `assert` is this package's product, not a debugging leftover: the gates are
# assertions, and rewriting them as `if ...: raise AssertionError` would only
# hide them from S101 while doing the same thing less readably.
"src/simcheck/gates.py" = ["S101"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.preen]
